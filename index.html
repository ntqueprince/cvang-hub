<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Search Console Verification Tag -->
  <meta name="google-site-verification" content="x_ixstwHS9BZamI" />

  <!-- Search Engine SEO Tags -->
  <title>CVANG | Projects Hub</title>
  <meta name="description" content="CVANG - Official Project & Tools Hub created by Shivang. Explore custom utilities, web tools, and live projects.">
  <meta name="keywords" content="cvang, cvang.in, shivang, shivang jaiswal, projects, cool app">
  <meta name="author" content="Shivang">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 29, 47, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #38bdf8;
      --accent-indigo: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      position: relative;
      overflow-x: hidden;
    }

    .glow-top {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      height: 320px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(56, 189, 248, 0.12) 45%, transparent 70%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      max-width: 540px;
      width: 100%;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .avatar-wrapper {
      width: 74px;
      height: 74px;
      margin: 0 auto 16px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      padding: 2px;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      background: #0f172a;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .rainbow-sub {
      font-size: 0.85rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ff4e50, #f9d423, #1dd1a1, #54a0ff, #9b59b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .links-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .project-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-decoration: none;
      color: inherit;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .project-card:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(30, 41, 67, 0.85);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .card-meta h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-meta p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .badge {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-arrow {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .project-card:hover .card-arrow {
      color: #fff;
      background: var(--accent-cyan);
      transform: translateX(3px) rotate(-45deg);
    }

    footer {
      margin-top: 45px;
      font-size: 0.78rem;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="glow-top"></div>

  <div class="container">
    <div class="avatar-wrapper">
      <div class="avatar-inner">CV</div>
    </div>
    <h1 class="brand-title">CVANG</h1>
    <div class="rainbow-sub">created by shivang</div>

    <div class="links-wrapper">
      <!-- Cool Project Card -->
      <a href="https://ntqueprince.github.io/cool" target="_blank" class="project-card">
        <div class="card-left">
          <div class="card-icon">⚡</div>
          <div class="card-meta">
            <h3>Cool App <span class="badge">Live</span></h3>
            <p>Interactive web utility & project hub</p>
          </div>
        </div>
        <div class="card-arrow">➜</div>
      </a>
    </div>

    <footer>
      © 2026 cvang.in • All Rights Reserved
    </footer>
  </div>

</body>
</html>
